name: Stack

# Runs the platform as REAL PROCESSES against REAL DEPENDENCIES and drives the
# journey the in-process e2e suite cannot: LocalStack KMS + S3, Redpanda, clamd,
# tesseract, cross-service HTTP, and the audit chain assembled from events that
# crossed a broker.
#
# BLOCKING, and designed so that it can be. The determinism contract:
#   * no bare sleeps anywhere — `compose up --wait` for health, and every
#     in-test wait is a poll with a deadline;
#   * topics are provisioned explicitly before any service starts (Redpanda
#     ships auto-create OFF), so nothing races the first produce;
#   * clamd's signature database is baked into its image and its healthcheck is
#     `clamdscan --ping`, which distinguishes "listening" from "ready" — the
#     scan gate is fail-closed, so a warm-up race would fail every upload;
#   * infra images are tag-pinned;
#   * `timeout-minutes` on the job, because a container that will not exit
#     would otherwise run to GitHub's 6-hour limit;
#   * jest's own JSON result is checked for the EXACT number of passed and
#     pending tests, so a suite that silently skipped turns the job red even
#     though jest was green (ci-guard.spec.ts covers the env-var half; this
#     covers the rest). Exact rather than a floor: the M8 security review found
#     the floors sitting two tests below the real counts, and the slack was
#     wide enough to `.skip` the clamd FOUND path and the OCR→search path and
#     still go green.
#
# The FAST gate runs services from `dist` on the runner (no image builds).
# Artifact fidelity — the shipped images actually running this stack — is a job
# in images.yml, where the images are already built.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  # A LEVER FOR A GATE THAT OTHERWISE HAS NONE, and the reason is measured
  # rather than hypothetical. On 2026-08-19 the post-merge run for `388d22b`
  # sat in `queued` having created ZERO jobs — eleven hours later its
  # `updatedAt` still equalled its `createdAt`, so it never ran and never will.
  # Two LATER runs of this same workflow on the same repo, created one minute
  # after it, started and finished normally — so it was that run, not runner
  # capacity, and not an Actions incident (the status page read operational
  # throughout). It could not be recovered: `cancel` and `force-cancel` both
  # answered HTTP 500, `rerun` was refused as "already running", and with only
  # `push` and `pull_request` declared there was no way to ask for a fresh one.
  # The heaviest gate in the repo had no lever at all, and the only resolution
  # available was to wait for somebody to push to `main` again.
  #
  # That is security.yml's lesson in a different costume: a gate you cannot
  # INVOKE is a gate you can only OBSERVE, and the latency of waiting for an
  # external trigger is how a gate's failures go unnoticed. Measured across the
  # six workflows here: THREE already carried it, `notify-failure.yml` is
  # `workflow_call`-only and cannot carry it (a reusable workflow is invoked by
  # its callers, not by events), and the two that could and did not were this
  # one and `ci.yml` — the two heaviest gates in the repo.
  #
  # WHAT IT DOES AND DOES NOT RECOVER — measured at the moment the change adding
  # these lines merged, rather than predicted. The prediction was that
  # `concurrency` below, grouping on the ref with `cancel-in-progress`, would let
  # a dispatch on `main` clear a stuck `main` run. HALF OF THAT IS TRUE AND THE
  # LOAD-BEARING HALF IS NOT:
  #   * cancellation in this group WORKS — a dispatch created 19s after the
  #     merge's own push run superseded it, and that run reached
  #     completed/cancelled about seventy seconds later;
  #   * it NEVER REACHES A WEDGED RUN — two fresh runs arrived in the 05:24
  #     wedge's own group and its `updatedAt` still equalled its `createdAt`.
  #     At that same moment `gh run cancel` was ACCEPTED on an ordinary pending
  #     run and answered HTTP 500 on the wedge, so being unreachable is specific
  #     to that run and is not a property of queued runs.
  # SO THIS IS STILL THE FIX, FOR A DIFFERENT REASON THAN FIRST WRITTEN: it
  # cannot evict the corpse, it buys a FRESH VERDICT, which is what was actually
  # missing. Telling the two apart is easy once you know to look — a healthy run
  # creates its jobs within a minute (the restored one: 2 jobs in 44s) where the
  # wedge has created zero, ever.
  #
  # AND IT IS A FOOT-GUN: dispatching on a ref that already has a live run in
  # this group CANCELS that run. Doing exactly that to the merge's own Stack run
  # is how the first bullet got measured, and main's verdict had to be restored
  # by dispatching again once the group was idle. Dispatch when the group is
  # idle, or when superseding is what you want.
  #
  # Also measured: a dispatch reads the workflow file AT THE REF IT IS GIVEN,
  # not from the default branch — `--ref` at the branch adding these lines
  # created a run while `--ref main` answered HTTP 422 "Workflow does not have
  # 'workflow_dispatch' trigger", and `--ref main` began working the moment it
  # merged. Which is also why it could not be rehearsed against the wedge it was
  # written for.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # The two profiles prove different things and neither should mask the
      # other: development runs every flow, production rehearses the fail-fast
      # posture and asserts the 503 gates fire.
      fail-fast: false
      matrix:
        profile: [development, production]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # TWO env files, because the two consumers live on different sides of the
      # container boundary and each needs its own addressing:
      #   .env.stack.compose — for anything docker compose runs. Container
      #     hostnames (pg-core:5432, redpanda:29092).
      #   .env.stack         — for the host-mode supervisor. Published ports on
      #     localhost.
      # Handing the host-addressed file to compose was the M8-review finding:
      # `localhost` inside a bootstrap container is that container's own
      # loopback, so every migration failed and the whole gate died before the
      # stack test ever ran. The doctor now refuses that combination outright.
      # The host file is DERIVED from the compose one, not generated beside it:
      # both address the same Postgres volumes, the same LocalStack keys and the
      # same bucket, so a second independent generation would give the host
      # processes a different KMS master key and a different search-index key
      # than the bootstrap jobs wrote under.
      - name: Generate the stack environments
        run: |
          STACK_ENV_FILE=.env.stack.compose \
            node apps/stack/dist/generate-env-cli.js --mode ${{ matrix.profile }}
          node apps/stack/dist/generate-env-cli.js --mode ${{ matrix.profile }} \
            --addressing host --from .env.stack.compose

      # The preflight that refuses a non-local AWS endpoint, real-looking
      # credentials, a mismatched credential graph, disabled TLS verification,
      # or an addressing that does not match its consumer. It gates `up`
      # locally; it gates the job here. Both files are checked.
      - name: Preflight
        run: |
          node apps/stack/dist/doctor-cli.js .env.stack.compose --for compose
          node apps/stack/dist/doctor-cli.js .env.stack --for host

      - name: Start infrastructure
        run: |
          docker compose --env-file .env.stack.compose -f docker-compose.stack.yml up -d --wait \
            pg-auth pg-core pg-financial pg-documents pg-vault pg-audit \
            redpanda localstack aws-tls clamav tesseract

      - name: Provision topics, migrate, seed
        run: |
          docker compose --env-file .env.stack.compose -f docker-compose.stack.yml \
            --profile bootstrap up --build --exit-code-from provision-topics provision-topics
          # The migrate list is DERIVED from the compose file, never hand-kept:
          # a copied list here silently omitted migrate-notifications when M9
          # added the ninth service, so the stack came up against a core
          # cluster missing the notifications tables and this gate failed on
          # the chain assertion. (images.yml is immune — it brings up full
          # profiles, where compose's depends_on graph runs every migration.)
          migrations=$(docker compose --env-file .env.stack.compose -f docker-compose.stack.yml \
            --profile bootstrap config --services | grep '^migrate-' | sort)
          test -n "$migrations"
          for job in $migrations seed-templates; do
            docker compose --env-file .env.stack.compose -f docker-compose.stack.yml \
              --profile bootstrap up --build --exit-code-from "$job" "$job"
          done

      - name: Run the stack
        run: |
          node apps/stack/dist/run-services-cli.js .env.stack --repo-root "$PWD" > stack.log 2>&1 &
          echo $! > stack.pid
          # The supervisor waits for every port itself and exits non-zero if a
          # child dies; poll for its readiness line rather than sleeping.
          deadline=$((SECONDS + 180))
          until grep -q 'stack up:' stack.log; do
            if ! kill -0 "$(cat stack.pid)" 2>/dev/null; then
              echo "::error::the supervisor exited before the stack came up"
              cat stack.log
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::stack did not come up within 180s"
              cat stack.log
              exit 1
            fi
          done
          cat stack.log

      - name: Stack test
        env:
          CI_REQUIRE_STACK: '1'
          STACK_TEST: '1'
          STACK_PROFILE: ${{ matrix.profile }}
          PG_TEST_URL: postgres://estate:estate_dev@localhost:5434/core
        run: |
          cd apps/e2e
          npx jest test/stack.e2e.spec.ts test/aws-conformance.spec.ts test/ci-guard.spec.ts \
            --runInBand --json --outputFile=../../stack-results.json

      # Jest exits 0 for a suite whose every test SKIPPED. The gate variable
      # above makes ci-guard fail in that case, but only for the variable it
      # can see — this closes the general case by asserting work was done.
      - name: Assert the suite actually ran
        if: always()
        run: |
          if [ ! -f stack-results.json ]; then
            echo "::error::no jest result file — the stack test did not run"
            exit 1
          fi
          node -e '
            const r = require("./stack-results.json");
            // EXACT counts, not floors. The original floors sat two tests below
            // the real numbers, and the slack was exactly the size of the two
            // most environment-sensitive assertions (the clamd FOUND path and
            // the OCR->encrypted-search path) — .skip both and the gate still
            // went green. Pending is also exact rather than zero, because
            // profile gating legitimately skips the OTHER profile'"'"'s block.
            const production = process.env.MATRIX_PROFILE === "production";
            // M9 PR2 added the dev-journey legal-hold round trip: dev gains a
            // pass, production gains its skip. M10 PR3 added the estate-analysis
            // round trip the same way — the assistant container is absent from
            // the production profile (LLM_MODE=anthropic, no credential), so
            // that test can only ever run in dev. M13 added the people-surface
            // round trip (step-up on a role, and a profile edit that keeps the
            // SSN) in the same dev block, so dev gains a pass and production a
            // skip: 16/4 -> 17/4 and 9/11 -> 9/12. M14 added the
            // address-verification ceremony — a code read out of a REAL
            // delivered SES message and typed back in — to the same dev block:
            // 17/4 -> 18/4 and 9/12 -> 9/13. M15 added SIX tests for the
            // isolated vault origin — the CSP and Trusted-Types posture on the
            // wire, the client bundle really being served from the image, the
            // arrival Origin check, the audience boundary across every service,
            // burn-on-attempt with a uniform refusal, and an audit trail that
            // records the ceremony without recording which refusal fired.
            //
            // They sit OUTSIDE the profile split, unlike the plaid and
            // assistant cases: the vault origin runs in BOTH profiles because
            // nothing about it needs a third-party credential. So both legs
            // gain all six: 18/4 -> 24/4 and 9/13 -> 15/13.
            //
            // NOTE: images.yml carries a TWIN of the development number, for
            // the stack-from-images job. Separate on purpose (that job runs
            // built images, this one runs `dist`), so a new stack test has to
            // be recorded in both — forgetting the second is how that gate went
            // red once, with the suite itself passing.
            //
            // M15 PR3 adds ONE more to each leg (24/4 -> 25/4, 15/13 -> 16/13):
            // the grantee-candidate projection, which is the only profile
            // response a `vault`-audience session may read. It runs in both
            // profiles because it drives the M14 address ceremony first —
            // minting a contact link code is an ARMING action, so a production
            // stack refuses an owner nobody proved.
            //
            // BOTH NUMBERS MEASURED, on a stack brought up in each profile.
            // Deriving one from the other would have been wrong here for an
            // instructive reason: run the production assertions against a
            // DEVELOPMENT stack and the M14 arming gate legitimately answers
            // 201 instead of 503, because `assertOwnerReachable` is
            // production-scoped. A derived number would have encoded that as a
            // pass.
            //
            // M18 PR2: +1 dev pass (the decrypt-rate baseline gate — a
            // deliberate burst proves the deployed detector fires, then every
            // anomaly event in the store must name the deliberate bound, so
            // journey traffic proving the false-positive half is the same
            // test that proves detector liveness). It is describeDev, so the
            // production leg gains it as +1 pending.
            //
            // M21 PR3b: +1 in BOTH profiles (the operator console reaching
            // settlement through its own edge). It sits in the unsplit
            // `describe`, like the rest of the isolated-origin tests, because
            // nothing about this origin needs a third-party credential —
            // so it is +1 passed in each rather than +1 passed / +1 pending.
            const expectedPassed = production ? 23 : 33;
            const expectedPending = production ? 14 : 4;
            console.log(`passed=${r.numPassedTests} failed=${r.numFailedTests} pending=${r.numPendingTests}`);
            if (r.numFailedTests > 0) { console.error("::error::stack test failures"); process.exit(1); }
            if (r.numPassedTests !== expectedPassed || r.numPendingTests !== expectedPending) {
              console.error(`::error::expected exactly ${expectedPassed} passed / ${expectedPending} pending, got ${r.numPassedTests}/${r.numPendingTests} — a spec skipped, or a test was added without updating this gate`);
              process.exit(1);
            }
          '
        env:
          MATRIX_PROFILE: ${{ matrix.profile }}

      # Same derivation as images.yml, and needed here for a reason that is not
      # obvious. The migrate loop above runs each job ATTACHED, so a job NAMED on
      # the command line streams its own failure — but its DEPENDENCIES do not.
      # That list is sorted, so it starts at migrate-ai-assistant, which pulls
      # migrate-notifications -> migrate-settlement -> migrate-profile in as
      # unattached prerequisites: a failure in any of those three prints the same
      # content-free `didn't complete successfully: exit 1` that images.yml hit,
      # and the hand-written list this replaces held five infra containers — no
      # migrator, and not one of the six pg-* containers. `--profile bootstrap`
      # alone is right here: services run on the host under the supervisor, whose
      # log is dumped first, which is why that group stays.
      - name: Diagnostics
        if: failure()
        run: |
          compose() {
            docker compose --env-file .env.stack.compose -f docker-compose.stack.yml \
              --profile bootstrap "$@"
          }
          echo '::group::supervisor'
          cat stack.log || true
          echo '::endgroup::'

          if [ ! -f .env.stack.compose ]; then
            echo 'no .env.stack.compose — the failure is before the stack was configured'
            exit 0
          fi

          # Load-bearing: a container left in `created` by a failed dependency
          # writes no log line at all, so this is what separates it from one that
          # started and said nothing.
          echo '::group::compose ps -a'
          compose ps -a || true
          echo '::endgroup::'

          # Exited containers first and in full — a migrator's whole output is
          # one `err.message` with no stack, so this is the one place a tail
          # could remove the answer.
          exited=$(compose ps -a --status exited --services || true)
          for svc in $(echo "$exited" | sort); do
            echo "::group::${svc} — exited, full log"
            compose logs --no-color "$svc" || true
            echo '::endgroup::'
          done

          echo '::group::every container, tail 80'
          compose logs --no-color --timestamps --tail 80 || true
          echo '::endgroup::'

      - name: Stop
        if: always()
        run: |
          [ -f stack.pid ] && kill "$(cat stack.pid)" 2>/dev/null || true
          docker compose --env-file .env.stack.compose -f docker-compose.stack.yml \
            --profile bootstrap --profile services --profile plaid --profile edge down -v || true
