name: Images

# Builds a container image for every deployable app, proves it is actually
# runnable, and records what is inside it.
#
# No registry push: no image registry has been chosen yet (ECR arrives with the
# cloud half of M5, which is deferred pending an AWS account). Building and
# verifying without pushing still catches the failure that matters today — a
# Dockerfile that does not produce a working image — and keeps this pipeline
# free of registry credentials.
#
# There is no Docker on the maintainer's Windows workstation, so THIS WORKFLOW
# IS THE ONLY VERIFIER for the image build. Treat a red run here as a broken
# image, not as CI flakiness.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  # THE MISSING HALF OF THE SCAN GATE'S COMPENSATING CONTROL.
  #
  # .github/scripts/gate-image-scan.mjs deliberately does NOT block on
  # base-image findings — a distroless image has no package manager, so the fix
  # belongs to the base vendor and blocking on their cadence yields a
  # permanently red pipeline people learn to ignore. What it names in exchange
  # is that "images rebuild from a floating patch tag on every CI run", which on
  # a week with no pushes means never. This rebuilds from the current base tags
  # and re-scans on a schedule, so a patched base lands — and a newly disclosed
  # base CVE appears in the job summary — without waiting for someone to commit.
  schedule:
    - cron: '17 9 * * 1'
  # So the rebuild can also be triggered by hand after an advisory, rather than
  # by pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by EVENT as well as ref. The weekly rebuild and a push to main share
  # `refs/heads/main`, so with cancel-in-progress a coinciding push would
  # silently kill the scheduled run — the one nobody is watching for, and the
  # only one that exists to catch a base-image CVE on a quiet week.
  group: images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One broken service image should not hide the state of the others. (No
      # count here on purpose — it was "seven" while the matrix held eleven.)
      fail-fast: false
      matrix:
        include:
          - app: identity
            pkg: '@estate/service-identity'
          - app: profile
            pkg: '@estate/service-profile'
          - app: assets
            pkg: '@estate/service-assets'
          - app: plaid
            pkg: '@estate/service-plaid'
          - app: documents
            pkg: '@estate/service-documents'
          - app: audit
            pkg: '@estate/service-audit'
          - app: vault
            pkg: '@estate/service-vault'
          - app: settlement
            pkg: '@estate/service-settlement'
          - app: notifications
            pkg: '@estate/service-notifications'
          - app: ai-assistant
            pkg: '@estate/service-ai-assistant'
          - app: bff
            pkg: '@estate/bff'
            kind: bff
            # Every setting has a development default, so a bare run would
            # listen forever; its fail-fast guard is production-only.
            smokeProduction: true
          # M15's isolated vault origin. Same shape as the BFF: development
          # defaults for every upstream, and a production guard that requires
          # them explicitly — so the fail-fast posture is only reachable with
          # NODE_ENV=production.
          - app: vault-web
            pkg: '@estate/vault-web'
            smokeProduction: true
          # M21 PR3a's isolated operator origin. Same shape again, and its
          # environment is shorter still — two URLs, both with development
          # defaults, so production is the only posture where the guard fires.
          - app: operator-web
            pkg: '@estate/operator-web'
            smokeProduction: true
          - app: web
            pkg: '@estate/web'
            dockerfile: infra/docker/web.Dockerfile
            kind: web
            # BUILT WITH NON-DEFAULT ORIGINS ON PURPOSE, because the only way to
            # tell a value that arrived from a value that fell through to its
            # default is to make them differ. `.invalid` is reserved by RFC 2606
            # and can never resolve, so nothing here can accidentally reach a
            # real host — these exist to be READ BACK OUT of the served header,
            # never to be contacted. The image is loaded locally and never
            # pushed, so no artifact carries them.
            #
            # This is the assertion that was missing when compose passed both of
            # these to a Dockerfile with no ARG to receive them: every layer had
            # a fence checking its own half, and nothing checked that the value
            # survived the whole chain into the artifact.
            extraBuildArgs: |
              VAULT_ORIGIN=https://vault.probe.invalid
              OPERATOR_ORIGIN=https://operator.probe.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile || 'infra/docker/node-service.Dockerfile' }}
          build-args: |
            PKG=${{ matrix.pkg }}
            ${{ matrix.extraBuildArgs }}
          tags: estate/${{ matrix.app }}:ci
          # Load into the local daemon so the smoke test can run it; never push.
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # An image must FAIL CLOSED when it cannot be configured, and the message —
      # not just the exit code — is the signal, since a broken image also exits
      # non-zero.
      #
      # Every service requires real config (DATABASE_URL and friends) in every
      # environment, so running one bare must fail. The BFF is deliberately
      # different: every one of its settings has a development default, so bare
      # it would start and listen forever. Its fail-fast guard is production-only
      # (persisted operations are mandatory there), so that is what we assert.
      #
      # `timeout` wraps the run because a container that DOESN'T exit would
      # otherwise hang the job until GitHub's 6-hour limit — an earlier revision
      # of this workflow did exactly that for 40 minutes.
      - name: Smoke test — config fail-fast
        if: matrix.kind != 'web'
        env:
          # Apps whose settings all have development defaults reach their
          # fail-fast guard only under a production posture (the BFF's persisted
          # operations, the vault origin's four required upstreams). Flagged per
          # entry rather than inferred from `kind`, which also drives the
          # web/liveness branch and would quietly conflate the two.
          SMOKE_ENV: ${{ matrix.smokeProduction && '-e NODE_ENV=production' || '' }}
        run: |
          set +e
          output=$(timeout 60 docker run --rm --name smoke-${{ matrix.app }} \
            $SMOKE_ENV estate/${{ matrix.app }}:ci 2>&1)
          code=$?
          set -e
          docker rm -f smoke-${{ matrix.app }} >/dev/null 2>&1 || true
          echo "$output"
          if [ "$code" -eq 124 ]; then
            echo "::error::image kept running without valid configuration — fail-fast posture lost"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "::error::image exited 0 without valid configuration — fail-fast posture lost"
            exit 1
          fi
          if ! echo "$output" | grep -Eq 'configuration|environment variables'; then
            echo "::error::no config-validation error — image may not contain a bootable app"
            exit 1
          fi

      # The frontend has no secrets to validate, so its liveness IS the check.
      #
      # Liveness alone is not enough. `output: 'standalone'` omits BOTH
      # `.next/static` and `public/` from the traced bundle, so each reaches the
      # image only via an explicit COPY in web.Dockerfile — and a missing one is
      # invisible here: the server still boots, the page still renders, and only
      # the asset 404s. That is exactly what happened to the vendored Instrument
      # Sans files for several milestones (the whole point of vendoring them is
      # that no page load touches a third-party CDN, which a 404 defeats). So
      # every file under apps/web/public must come back 200 from the image.
      #
      # Derived from the repo tree rather than hardcoded, so a newly added asset
      # is covered without anyone remembering to extend this list — and so a
      # .dockerignore rule that starts excluding something under public/ turns
      # this red instead of shipping quietly.
      - name: Smoke test — web serves
        if: matrix.kind == 'web'
        run: |
          docker run -d --name web -p 3000:3000 estate/web:ci
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs web
          if [ -z "$ok" ]; then
            docker rm -f web >/dev/null
            echo "::error::web image did not serve on :3000"
            exit 1
          fi

          missing=
          for f in $(find apps/web/public -type f | sort); do
            asset="${f#apps/web/public}"
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${asset}")
            echo "public${asset} -> ${code}"
            [ "$code" = 200 ] || missing="${missing} ${asset}(${code})"
          done

          # THE BUILD ARGS REACHED THE ARTIFACT, asserted in the shipped image
          # rather than in the three files that are supposed to carry them.
          #
          # `next.config.ts` bakes `form-action 'self' ${VAULT_ORIGIN}
          # ${OPERATOR_ORIGIN}` into the routes manifest at build time, and that
          # directive is the ONLY thing permitting the top-level form POST that
          # opens the vault origin (M15) and the operator console (M21 PR3a).
          # Both values were being dropped — web.Dockerfile declared no ARG for
          # either and turbo.json's strict `env` stripped them — so an image
          # built for real origins would have named the localhost ones and had
          # the browser refuse both handoffs. Nothing was red, because each
          # layer's own fence only ever checked that layer.
          #
          # The probe values differ from the defaults precisely so a value that
          # fell through is distinguishable from a value that arrived; asserting
          # the DEFAULTS are absent is the half that catches a silent fallback.
          csp=$(curl -sI http://localhost:3000 | tr -d '\r' \
                | grep -i '^content-security-policy:' || true)
          docker rm -f web >/dev/null
          if [ -z "$csp" ]; then
            echo "::error::the image served no Content-Security-Policy header at all"
            exit 1
          fi
          echo "$csp"
          for origin in https://vault.probe.invalid https://operator.probe.invalid; do
            case "$csp" in
              *"$origin"*) ;;
              *) echo "::error::build arg did not reach the artifact: ${origin} absent from form-action"
                 exit 1;;
            esac
          done
          for fallback in http://vault.localhost:3010 http://operator.localhost:3011; do
            case "$csp" in
              *"$fallback"*) echo "::error::next.config.ts fell through to ${fallback} — the build arg was dropped"
                             exit 1;;
            esac
          done

          if [ -n "$missing" ]; then
            echo "::error::the image does not serve public/ assets:${missing}"
            exit 1
          fi

      # ONE `docker save`, TWO consumers. The scan step below used to produce
      # its own copy; these archives are hundreds of megabytes and building
      # each twice was pure cost.
      - name: Freeze the image for analysis
        run: docker save estate/${{ matrix.app }}:ci -o /tmp/${{ matrix.app }}.tar

      # What shipped, in machine-readable form. Retained as an artifact now;
      # it becomes an attached attestation once images are pushed to a registry.
      #
      # A PINNED CONTAINER RATHER THAN `anchore/sbom-action`, and the reason is
      # a failure this file already knew how to avoid. The action downloads the
      # syft BINARY from GitHub releases on every job, and when that endpoint
      # answered 503 it took `main` red twice over — three of fourteen matrix
      # jobs on one run, a different three on the next, all of them at the
      # download and none of them for any reason to do with the images. The scan
      # step directly below has never had that problem because it runs a PINNED
      # CONTAINER, so the fix is to do here what the next step already does.
      # It also pins the SBOM generator's version, which the action left to
      # whatever it resolved that day.
      #
      # THE RETRY IS THE BELT, not the fix. Pulling from a registry can blip
      # too, and a bounded backoff costs nothing when everything is well. The
      # LAST attempt is not swallowed: a persistent failure still fails the job,
      # because an SBOM that silently stops being produced is exactly the sort
      # of gate that rots unnoticed.
      - name: Generate SBOM
        run: |
          set -uo pipefail
          out="/tmp/sbom-${{ matrix.app }}.spdx.json"
          for attempt in 1 2 3; do
            if docker run --rm -v /tmp:/w anchore/syft:v1.42.3 \
                 "docker-archive:/w/${{ matrix.app }}.tar" -o spdx-json --quiet > "$out"; then
              # ANTI-VACUITY: syft can exit 0 having catalogued nothing, and an
              # empty document is a useless artifact that looks like a good one.
              count=$(node -e 'const d=require(process.argv[1]);console.log((d.packages||[]).length)' "$out" 2>/dev/null || echo 0)
              if [ "${count:-0}" -gt 0 ]; then
                echo "SBOM: ${count} packages"
                exit 0
              fi
              echo "::warning::attempt ${attempt} produced an SBOM with no packages"
            else
              echo "::warning::syft attempt ${attempt} failed"
            fi
            sleep $((attempt * 10))
          done
          echo "::error::syft produced no usable SBOM after 3 attempts"
          exit 1

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: /tmp/sbom-${{ matrix.app }}.spdx.json
          if-no-files-found: warn

      # Scan, then gate by OWNERSHIP rather than by severity alone: application
      # dependencies are ours to bump and block the build; base-image packages
      # (Debian libs, the bundled node binary) cannot be patched from here — a
      # distroless image has no package manager — so they are reported instead
      # of blocking every PR on the base vendor's rebuild cadence. See
      # .github/scripts/gate-image-scan.mjs for the full rationale.
      - name: Scan image for vulnerabilities
        run: |
          docker run --rm -v /tmp:/w anchore/grype:v0.97.1 \
            "docker-archive:/w/${{ matrix.app }}.tar" -o json --quiet \
            > /tmp/grype-${{ matrix.app }}.json
          node .github/scripts/gate-image-scan.mjs \
            /tmp/grype-${{ matrix.app }}.json ${{ matrix.app }}

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-${{ matrix.app }}
          path: /tmp/grype-${{ matrix.app }}.json
          if-no-files-found: warn

  # ARTIFACT FIDELITY: the same stack test, driven against the SHIPPED IMAGES
  # rather than services run from `dist`.
  #
  # stack.yml is the fast per-PR gate and runs the node processes directly; it
  # proves the code integrates. It cannot prove the IMAGE does — a broken
  # entrypoint, a resource tree missing from the runtime layer, or a distroless
  # base that lost its interpreter would all pass there and fail in production.
  # This job closes that, and it lives here because the images are already
  # built above rather than paying for a second set of builds.
  stack-from-images:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Only @estate/stack and the e2e package's dependencies are needed: the
      # services themselves come from images.
      - name: Build
        run: pnpm build

      - name: Generate the stack environment (compose addressing)
        run: node apps/stack/dist/generate-env-cli.js --mode development

      # `--for compose`: everything here runs as containers, so a host-addressed
      # file must be refused rather than producing nine services that boot and
      # fail on every request.
      - name: Preflight
        run: node apps/stack/dist/doctor-cli.js .env.stack --for compose

      # Compose builds with the same cache the matrix above populated, so this
      # is a cache restore rather than a rebuild.
      - name: Bring the stack up from images
        run: |
          docker compose --env-file .env.stack -f docker-compose.stack.yml \
            --profile bootstrap --profile services --profile plaid --profile edge \
            up -d --build --wait

      - name: Stack test against the shipped images
        env:
          CI_REQUIRE_STACK: '1'
          STACK_TEST: '1'
          STACK_PROFILE: development
          PG_TEST_URL: postgres://estate:estate_dev@localhost:5434/core
        run: |
          cd apps/e2e
          npx jest test/stack.e2e.spec.ts test/aws-conformance.spec.ts test/ci-guard.spec.ts \
            --runInBand --json --outputFile=../../stack-results.json

      - name: Assert the suite actually ran
        if: always()
        run: |
          if [ ! -f stack-results.json ]; then
            echo "::error::no jest result file — the stack test did not run"
            exit 1
          fi
          node -e '
            const r = require("./stack-results.json");
            // EXACT counts (development profile). A floor with slack in it is
            // how two skipped assertions stay green; see stack.yml.
            console.log(`passed=${r.numPassedTests} failed=${r.numFailedTests} pending=${r.numPendingTests}`);
            if (r.numFailedTests > 0) { console.error("::error::stack test failures"); process.exit(1); }
            // M13 added the people-surface round trip: 16/4 -> 17/4. M14 added
            // the address-verification ceremony: 17/4 -> 18/4. M15 added six
            // for the isolated vault origin: 18/4 -> 24/4. M15 PR3 added the
            // grantee-candidate projection: 24/4 -> 25/4. M18 PR2 added the
            // decrypt-rate baseline gate: 25/4 -> 26/4. Measured on a
            // development-profile stack, which is what this job runs.
            //
            // THIS NUMBER HAS A TWIN in stack.yml, which gates both profiles.
            // They are separate on purpose — this job runs the stack from BUILT
            // IMAGES and that one runs it from `dist`, so a number derived from
            // the other would stop being a measurement. The cost is that a new
            // stack test has to be recorded in two places, and forgetting the
            // second is exactly how this gate went red once: the suite passed
            // 25/4 and only the stale copy of the number failed. If a third
            // consumer of this count ever appears, derive it.
            if (r.numPassedTests !== 32 || r.numPendingTests !== 4) {
              console.error(`::error::expected exactly 32 passed / 4 pending, got ${r.numPassedTests}/${r.numPendingTests} — a spec skipped, or a test was added without updating this gate (and its twin in stack.yml)`);
              process.exit(1);
            }
          '

      # WHAT THIS STEP IS FOR: naming the container that failed. `up --wait`
      # reports only `service "migrate-documents" didn't complete successfully:
      # exit 1`, and the hand-written list this replaces held nine long-running
      # services and no bootstrap job at all — so a real failure printed sixty
      # lines each from healthy containers, an EMPTY block for `documents`
      # (whose depends_on chain runs through the job that died), and nothing
      # from the one container that had the answer. The set is derived from the
      # project now, on the same reasoning as the migrate list in stack.yml and
      # the public/ asset list above: this is the third instance of that
      # hand-copied-list drift.
      #
      # Four properties this leans on, each measured against compose rather
      # than assumed:
      #   * `logs` covers containers that have EXITED, which here is the only
      #     interesting kind — the one-shot jobs are `restart: 'no'`, so a
      #     failed migrator's container and its log survive. That holds ONLY
      #     because `Stop` (`down -v`) runs after this step; removing the
      #     containers destroys their logs and the symptom is a silent empty
      #     step. These two steps must not be reordered.
      #   * the --profile flags are REQUIRED for the bare, service-less form.
      #     Naming a service activates its profile implicitly (which is why the
      #     old loop worked without them), but `logs` with no service argument
      #     is filtered to the ACTIVE profiles and returns only the ten
      #     unprofiled infra containers out of thirty-five — exit 0, no
      #     warning. They live in one shell function so `ps` and `logs` cannot
      #     drift apart; the old step passed them to `ps` only.
      #   * the bare dump INTERLEAVES containers, so it is context, not the
      #     answer: the exited containers get their own framed, untruncated
      #     block first.
      #   * `--tail` is per container, so 80 x 35 bounds the rest.
      #
      # Do NOT "improve" this with `docker inspect` or `compose config`: those
      # print the resolved environment, which is where the generated service
      # credentials and KMS keys live. Container logs do not — every
      # ConfigError carries zod issue paths and messages only, and a migrator
      # prints `err.message`, never its connection string.
      - name: Diagnostics
        if: failure()
        run: |
          compose() {
            docker compose --env-file .env.stack -f docker-compose.stack.yml \
              --profile bootstrap --profile services --profile plaid --profile edge "$@"
          }
          # Install, Build, Generate and Preflight all precede the stack, and
          # under `bash -e` a missing env file would otherwise make this whole
          # step one `couldn't find env file` line.
          if [ ! -f .env.stack ]; then
            echo 'no .env.stack — the failure is before the stack was configured'
            exit 0
          fi

          # LOAD-BEARING, not redundant with the logs below: a service whose
          # dependency failed stays in `created` and never writes a line, so
          # this is the only thing that distinguishes "never started" from
          # "started and said nothing".
          echo '::group::compose ps -a'
          compose ps -a || true
          echo '::endgroup::'

          # The containers that exited, first and IN FULL. One of them is the
          # cause, and a migrator's entire output is `err.message` with no
          # stack — the one place a tail could truncate away the answer. If a
          # runner's compose lacks these flags the derivation prints its error
          # and yields nothing, and the whole-project dump below still carries
          # the failing container: the enhancement can fail, the diagnostic
          # cannot.
          exited=$(compose ps -a --status exited --services || true)
          for svc in $(echo "$exited" | sort); do
            echo "::group::${svc} — exited, full log"
            compose logs --no-color "$svc" || true
            echo '::endgroup::'
          done

          # Then everything, bounded. Timestamped because compose interleaves
          # this form, and a stack failure is usually a question about ordering
          # across containers.
          echo '::group::every container, tail 80'
          compose logs --no-color --timestamps --tail 80 || true
          echo '::endgroup::'

      - name: Stop
        if: always()
        run: |
          docker compose --env-file .env.stack -f docker-compose.stack.yml \
            --profile bootstrap --profile services --profile plaid --profile edge down -v || true

  # Same reasoning as security.yml: the weekly rebuild exists precisely so a
  # patched base image lands without anyone pushing, which means nobody is
  # watching when it breaks.
  notify-on-failure:
    needs: [build, stack-from-images]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/notify-failure.yml
    permissions:
      issues: write
    with:
      workflow: Images
      details: >-
        The weekly rebuild re-pulls the floating base tags and re-scans, so a
        failure here is usually either a newly disclosed CVE in our own npm tree
        (the only class that blocks — base-image findings go to the job summary)
        or the stack failing to come up from the built images. The Diagnostics
        step dumps every exited container in full; start there.
