name: Images

# Builds a container image for every deployable app, proves it is actually
# runnable, and records what is inside it.
#
# No registry push: no image registry has been chosen yet (ECR arrives with the
# cloud half of M5, which is deferred pending an AWS account). Building and
# verifying without pushing still catches the failure that matters today — a
# Dockerfile that does not produce a working image — and keeps this pipeline
# free of registry credentials.
#
# There is no Docker on the maintainer's Windows workstation, so THIS WORKFLOW
# IS THE ONLY VERIFIER for the image build. Treat a red run here as a broken
# image, not as CI flakiness.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  # THE MISSING HALF OF THE SCAN GATE'S COMPENSATING CONTROL.
  #
  # .github/scripts/gate-image-scan.mjs deliberately does NOT block on
  # base-image findings — a distroless image has no package manager, so the fix
  # belongs to the base vendor and blocking on their cadence yields a
  # permanently red pipeline people learn to ignore. What it names in exchange
  # is that "images rebuild from a floating patch tag on every CI run", which on
  # a week with no pushes means never. This rebuilds from the current base tags
  # and re-scans on a schedule, so a patched base lands — and a newly disclosed
  # base CVE appears in the job summary — without waiting for someone to commit.
  schedule:
    - cron: '17 9 * * 1'
  # So the rebuild can also be triggered by hand after an advisory, rather than
  # by pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by EVENT as well as ref. The weekly rebuild and a push to main share
  # `refs/heads/main`, so with cancel-in-progress a coinciding push would
  # silently kill the scheduled run — the one nobody is watching for, and the
  # only one that exists to catch a base-image CVE on a quiet week.
  group: images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One broken service image should not hide the state of the others. (No
      # count here on purpose — it was "seven" while the matrix held eleven.)
      fail-fast: false
      matrix:
        include:
          - app: identity
            pkg: '@estate/service-identity'
          - app: profile
            pkg: '@estate/service-profile'
          - app: assets
            pkg: '@estate/service-assets'
          - app: plaid
            pkg: '@estate/service-plaid'
          - app: documents
            pkg: '@estate/service-documents'
          - app: audit
            pkg: '@estate/service-audit'
          - app: vault
            pkg: '@estate/service-vault'
          - app: settlement
            pkg: '@estate/service-settlement'
          - app: notifications
            pkg: '@estate/service-notifications'
          - app: ai-assistant
            pkg: '@estate/service-ai-assistant'
          - app: bff
            pkg: '@estate/bff'
            kind: bff
          - app: web
            pkg: '@estate/web'
            dockerfile: infra/docker/web.Dockerfile
            kind: web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile || 'infra/docker/node-service.Dockerfile' }}
          build-args: PKG=${{ matrix.pkg }}
          tags: estate/${{ matrix.app }}:ci
          # Load into the local daemon so the smoke test can run it; never push.
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # An image must FAIL CLOSED when it cannot be configured, and the message —
      # not just the exit code — is the signal, since a broken image also exits
      # non-zero.
      #
      # Every service requires real config (DATABASE_URL and friends) in every
      # environment, so running one bare must fail. The BFF is deliberately
      # different: every one of its settings has a development default, so bare
      # it would start and listen forever. Its fail-fast guard is production-only
      # (persisted operations are mandatory there), so that is what we assert.
      #
      # `timeout` wraps the run because a container that DOESN'T exit would
      # otherwise hang the job until GitHub's 6-hour limit — an earlier revision
      # of this workflow did exactly that for 40 minutes.
      - name: Smoke test — config fail-fast
        if: matrix.kind != 'web'
        env:
          # Only the BFF needs a production posture to reach its guard.
          SMOKE_ENV: ${{ matrix.kind == 'bff' && '-e NODE_ENV=production' || '' }}
        run: |
          set +e
          output=$(timeout 60 docker run --rm --name smoke-${{ matrix.app }} \
            $SMOKE_ENV estate/${{ matrix.app }}:ci 2>&1)
          code=$?
          set -e
          docker rm -f smoke-${{ matrix.app }} >/dev/null 2>&1 || true
          echo "$output"
          if [ "$code" -eq 124 ]; then
            echo "::error::image kept running without valid configuration — fail-fast posture lost"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "::error::image exited 0 without valid configuration — fail-fast posture lost"
            exit 1
          fi
          if ! echo "$output" | grep -Eq 'configuration|environment variables'; then
            echo "::error::no config-validation error — image may not contain a bootable app"
            exit 1
          fi

      # The frontend has no secrets to validate, so its liveness IS the check.
      #
      # Liveness alone is not enough. `output: 'standalone'` omits BOTH
      # `.next/static` and `public/` from the traced bundle, so each reaches the
      # image only via an explicit COPY in web.Dockerfile — and a missing one is
      # invisible here: the server still boots, the page still renders, and only
      # the asset 404s. That is exactly what happened to the vendored Instrument
      # Sans files for several milestones (the whole point of vendoring them is
      # that no page load touches a third-party CDN, which a 404 defeats). So
      # every file under apps/web/public must come back 200 from the image.
      #
      # Derived from the repo tree rather than hardcoded, so a newly added asset
      # is covered without anyone remembering to extend this list — and so a
      # .dockerignore rule that starts excluding something under public/ turns
      # this red instead of shipping quietly.
      - name: Smoke test — web serves
        if: matrix.kind == 'web'
        run: |
          docker run -d --name web -p 3000:3000 estate/web:ci
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs web
          if [ -z "$ok" ]; then
            docker rm -f web >/dev/null
            echo "::error::web image did not serve on :3000"
            exit 1
          fi

          missing=
          for f in $(find apps/web/public -type f | sort); do
            asset="${f#apps/web/public}"
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${asset}")
            echo "public${asset} -> ${code}"
            [ "$code" = 200 ] || missing="${missing} ${asset}(${code})"
          done
          docker rm -f web >/dev/null
          if [ -n "$missing" ]; then
            echo "::error::the image does not serve public/ assets:${missing}"
            exit 1
          fi

      # What shipped, in machine-readable form. Retained as an artifact now;
      # it becomes an attached attestation once images are pushed to a registry.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: estate/${{ matrix.app }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.app }}.spdx.json
          output-file: sbom-${{ matrix.app }}.spdx.json

      # Scan, then gate by OWNERSHIP rather than by severity alone: application
      # dependencies are ours to bump and block the build; base-image packages
      # (Debian libs, the bundled node binary) cannot be patched from here — a
      # distroless image has no package manager — so they are reported instead
      # of blocking every PR on the base vendor's rebuild cadence. See
      # .github/scripts/gate-image-scan.mjs for the full rationale.
      - name: Scan image for vulnerabilities
        run: |
          docker save estate/${{ matrix.app }}:ci -o /tmp/${{ matrix.app }}.tar
          docker run --rm -v /tmp:/w anchore/grype:v0.97.1 \
            "docker-archive:/w/${{ matrix.app }}.tar" -o json --quiet \
            > /tmp/grype-${{ matrix.app }}.json
          node .github/scripts/gate-image-scan.mjs \
            /tmp/grype-${{ matrix.app }}.json ${{ matrix.app }}

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-${{ matrix.app }}
          path: /tmp/grype-${{ matrix.app }}.json
          if-no-files-found: warn

  # ARTIFACT FIDELITY: the same stack test, driven against the SHIPPED IMAGES
  # rather than services run from `dist`.
  #
  # stack.yml is the fast per-PR gate and runs the node processes directly; it
  # proves the code integrates. It cannot prove the IMAGE does — a broken
  # entrypoint, a resource tree missing from the runtime layer, or a distroless
  # base that lost its interpreter would all pass there and fail in production.
  # This job closes that, and it lives here because the images are already
  # built above rather than paying for a second set of builds.
  stack-from-images:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Only @estate/stack and the e2e package's dependencies are needed: the
      # services themselves come from images.
      - name: Build
        run: pnpm build

      - name: Generate the stack environment (compose addressing)
        run: node apps/stack/dist/generate-env-cli.js --mode development

      # `--for compose`: everything here runs as containers, so a host-addressed
      # file must be refused rather than producing nine services that boot and
      # fail on every request.
      - name: Preflight
        run: node apps/stack/dist/doctor-cli.js .env.stack --for compose

      # Compose builds with the same cache the matrix above populated, so this
      # is a cache restore rather than a rebuild.
      - name: Bring the stack up from images
        run: |
          docker compose --env-file .env.stack -f docker-compose.stack.yml \
            --profile bootstrap --profile services --profile plaid --profile edge \
            up -d --build --wait

      - name: Stack test against the shipped images
        env:
          CI_REQUIRE_STACK: '1'
          STACK_TEST: '1'
          STACK_PROFILE: development
          PG_TEST_URL: postgres://estate:estate_dev@localhost:5434/core
        run: |
          cd apps/e2e
          npx jest test/stack.e2e.spec.ts test/aws-conformance.spec.ts test/ci-guard.spec.ts \
            --runInBand --json --outputFile=../../stack-results.json

      - name: Assert the suite actually ran
        if: always()
        run: |
          if [ ! -f stack-results.json ]; then
            echo "::error::no jest result file — the stack test did not run"
            exit 1
          fi
          node -e '
            const r = require("./stack-results.json");
            // EXACT counts (development profile). A floor with slack in it is
            // how two skipped assertions stay green; see stack.yml.
            console.log(`passed=${r.numPassedTests} failed=${r.numFailedTests} pending=${r.numPendingTests}`);
            if (r.numFailedTests > 0) { console.error("::error::stack test failures"); process.exit(1); }
            // M13 added the people-surface round trip: 16/4 -> 17/4.
            if (r.numPassedTests !== 17 || r.numPendingTests !== 4) {
              console.error(`::error::expected exactly 17 passed / 4 pending, got ${r.numPassedTests}/${r.numPendingTests} — a spec skipped, or a test was added without updating this gate`);
              process.exit(1);
            }
          '

      - name: Diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.stack -f docker-compose.stack.yml \
            --profile bootstrap --profile services --profile plaid --profile edge ps -a || true
          for svc in identity documents vault settlement audit localstack aws-tls clamav tesseract; do
            echo "--- $svc ---"
            docker compose --env-file .env.stack -f docker-compose.stack.yml logs --tail 60 "$svc" || true
          done

      - name: Stop
        if: always()
        run: |
          docker compose --env-file .env.stack -f docker-compose.stack.yml \
            --profile bootstrap --profile services --profile plaid --profile edge down -v || true
