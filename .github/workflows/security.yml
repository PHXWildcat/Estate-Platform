name: Security

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily sweep so new advisories surface without a push
  # The scheduled sweep is a DIFFERENT SCAN from the push one (see
  # .gitleaksignore's header for the mechanism), and until this trigger existed
  # it could only be exercised by waiting for 06:00 UTC. That latency is how the
  # sweep came to fail SEVENTEEN CONSECUTIVE RUNS — every scheduled run that has
  # ever executed, 2026-07-22 through 2026-08-07, never once green — on a finding
  # remediated in the tree the day after it was introduced.
  #
  # DISPATCH ON `main` IS THE REHEARSAL; a dispatch on any other ref is not.
  # The scan walks the SELECTED ref's history and reads the SELECTED ref's
  # `.gitleaksignore`, while the schedule only ever runs on main — so a green
  # dispatch on a feature branch is evidence about that branch and nothing else.
  # Also note this trigger is inert until it is on the DEFAULT branch, so the
  # commit that adds it cannot verify itself: merge, then dispatch against main,
  # then read the result.
  #
  # WHY THIS FILE HAS NO `concurrency:` BLOCK, unlike the other three workflows:
  # a dispatch and the nightly schedule both resolve to refs/heads/main, so
  # copying ci.yml's `cancel-in-progress: true` here would let a coinciding push
  # silently kill a full-history scan — the failure images.yml wrote its own
  # comment to prevent. The absence is deliberate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low

  # A scheduled run notifies nobody by default — no PR to turn red, no push
  # author to email — which is how this workflow's own sweep failed seventeen
  # consecutive times unremarked. Gated to schedule and dispatch on purpose: a
  # failing push or PR run already has someone watching it, and an issue per push
  # failure would bury the signal exactly as the seventeen were buried.
  notify-on-failure:
    needs: [secret-scan, codeql]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/notify-failure.yml
    permissions:
      issues: write
    with:
      workflow: Security
      details: >-
        The scheduled sweep scans the WHOLE HISTORY, unlike the push scan which
        covers only the pushed commits — so this can be red while every push and
        PR is green. A finding in a historical commit stays found even after the
        tree is remediated; the remedy is a 4-field `.gitleaksignore` fingerprint
        (see that file's header), never a path or rule exclusion. Reproduce with
        `gh workflow run security.yml --ref main`.
