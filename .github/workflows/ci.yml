name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  # Added in the SAME CHANGE as stack.yml's, and for the category rather than
  # the instance. The wedge that motivated this was a Stack run, so fixing only
  # Stack was the tempting move — but this repo's own rule is that a rule
  # applied to one member of a category is a rule half-applied, and the way to
  # tell is to ask what ELSE is in the category before calling the fix done.
  # Surveyed BY PARSING the workflows rather than grepping them, because the
  # first pass got this wrong: a substring grep reported four of six carrying
  # the trigger, and one of those four was `notify-failure.yml`, where the
  # string occurs only in a comment. Parsed, it is three of six — plus
  # `notify-failure.yml`, which is `workflow_call`-only and cannot carry a
  # dispatch at all — leaving `stack.yml` and this one. Nothing about the
  # failure mode is specific to Stack: any run can wedge, and a queued run
  # cannot be cancelled, rerun, or re-requested.
  workflow_dispatch:

permissions:
  contents: read

# Skip the branch-push run when a PR run for the same commit exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: estate
          POSTGRES_PASSWORD: estate_ci
          POSTGRES_DB: estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      # Build must precede lint: internal packages resolve types from their
      # built dist, and the type-aware lint rules report unresolved types as
      # unsafe-any errors when dist is missing.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The CI helper scripts under .github/scripts are plain node, outside every
      # workspace jest project, so `pnpm test` cannot see them — which is how
      # `gate-image-scan.mjs`, the script that decides whether a vulnerability
      # blocks a merge, has never had a test. `node --test` needs no dependency
      # and no project wiring, so there is no excuse for the next one either.
      # The glob is named explicitly because `node --test` does not walk a
      # DOT-directory: given `.github/scripts/` it hands the path to the module
      # loader and dies with MODULE_NOT_FOUND, which would have looked like a
      # broken test rather than a discovery quirk.
      - name: Test the CI helper scripts
        run: node --test .github/scripts/*.test.mjs

      # --coverage makes the per-package coverage tables visible in CI logs;
      # thresholds (95 backend / 90 frontend target) get enabled once real
      # CI-measured numbers exist — integration suites only run here, so local
      # coverage figures understate reality.
      - name: Test
        run: pnpm test -- --coverage
        env:
          PG_TEST_URL: postgres://estate:estate_ci@localhost:5432/estate_test

      # ─────────────────────────────────────────────────────────────────────
      # THE ONE CONFIGURATION NOTHING RAN, until the M16 PR5 review went
      # looking for why a coverage floor had drifted under without failing.
      #
      # `apps/services/identity/jest.config.js` sets its floor deliberately
      # near the number measured WITHOUT a database — the full-flow integration
      # suites are `describeIfPg` and skip without `PG_TEST_URL`, so that is the
      # number a developer sees, and the floor exists to be meaningful for them.
      # The step above sets `PG_TEST_URL`, so CI has only ever measured the
      # HIGH number. The floor was therefore evaluated by no gate at all, and
      # duly rotted: 62.24/66.60/28.43/60.24 against a 65/66/30/63 floor, under
      # on statements, lines AND functions, failing for anyone without Postgres.
      #
      # A threshold nothing evaluates is the fence-that-never-runs shape from
      # the other direction. This step is what makes it a gate.
      #
      # IT MUST PROVE IT RAN THE CONFIGURATION IT NAMES. A step that quietly
      # acquired a database would go green while measuring the wrong thing —
      # the same vacuity the stack workflow guards with exact counts — so the
      # `describeIfPg` suites are asserted to have SKIPPED. If that number is
      # ever 0, this step is testing the run the step above already covers.
      #
      # Scoped to identity because that is the package whose floor is
      # calibrated this way; another package adopting the convention adds its
      # own filter here rather than inheriting one by accident.
      - name: Test identity with NO database — the run its coverage floor is calibrated for
        working-directory: apps/services/identity
        env:
          PG_TEST_URL: ''
          # DECLARES this run to `test/ci-guard.spec.ts`, which otherwise
          # (correctly) fails any CI run with no PG_TEST_URL — the two gates
          # want opposite things from the same environment, and the first real
          # run of this step proved it by failing there. The flag is checked in
          # BOTH directions: a run that sets it and still has a database fails
          # the guard's other case, so it cannot be pasted into the step above
          # as a mute button.
          IDENTITY_NO_DB_RUN: '1'
        run: |
          set -euo pipefail
          if [ -n "${PG_TEST_URL:-}" ]; then
            echo "::error::PG_TEST_URL is set — this step exists to measure the run WITHOUT one"
            exit 1
          fi
          # `--coverage` is what arms the thresholds; without it jest exits 0
          # having checked nothing. Run through the package's own jest rather
          # than `pnpm --filter … test --`, which does NOT forward these flags
          # (measured: no coverage collected, no output file written, exit 0).
          # Written to the runner temp dir so the repo tree stays clean —
          # this artifact is read once, two lines below, and never committed.
          out="${RUNNER_TEMP:-.}/identity-nopg.json"
          npx jest --coverage --json --outputFile="$out"
          node -e '
            const r = require(process.argv[1]);
            const { numPassedTests: passed, numPendingTests: pending, numFailedTests: failed } = r;
            console.log(`passed=${passed} pending=${pending} failed=${failed}`);
            if (failed > 0) { console.error("::error::failures without a database"); process.exit(1); }
            if (pending === 0) {
              console.error("::error::no suite skipped, so a database was reachable — this step measured the wrong configuration");
              process.exit(1);
            }
            if (passed < 100) {
              console.error(`::error::only ${passed} tests ran; this step is not exercising the suite`);
              process.exit(1);
            }
          ' "$out"
