name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  # Added in the SAME CHANGE as stack.yml's, and for the category rather than
  # the instance. The wedge that motivated this was a Stack run, so fixing only
  # Stack was the tempting move — but this repo's own rule is that a rule
  # applied to one member of a category is a rule half-applied, and the way to
  # tell is to ask what ELSE is in the category before calling the fix done.
  # Surveyed BY PARSING the workflows rather than grepping them, because the
  # first pass got this wrong: a substring grep reported four of six carrying
  # the trigger, and one of those four was `notify-failure.yml`, where the
  # string occurs only in a comment. Parsed, it is three of six — plus
  # `notify-failure.yml`, which is `workflow_call`-only and cannot carry a
  # dispatch at all — leaving `stack.yml` and this one. Nothing about the
  # failure mode is specific to Stack: any run can wedge, and a queued run
  # cannot be cancelled, rerun, or re-requested.
  workflow_dispatch:

permissions:
  contents: read

# Supersede an older run on the SAME ref when a newer commit lands there.
#
# CORRECTED: this used to say it skipped the branch-push run when a PR run for
# the same commit existed. It cannot, and never did. `github.ref` is
# `refs/heads/<branch>` for a push and `refs/pull/<n>/merge` for a
# pull_request, so the two events land in DIFFERENT groups and neither can
# cancel the other. MEASURED over this repo's own history (400 runs of this
# workflow, grouped by sha): 67 shas received both a push run and a
# pull_request run, and 64 of those pairs ran both to completion with no
# cancellation at all. The three pairs that do contain one are same-event
# supersession — a newer commit arriving — which is what this block actually
# buys, and is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: estate
          POSTGRES_PASSWORD: estate_ci
          POSTGRES_DB: estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      # Build must precede lint: internal packages resolve types from their
      # built dist, and the type-aware lint rules report unresolved types as
      # unsafe-any errors when dist is missing.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The CI helper scripts under .github/scripts are plain node, outside every
      # workspace jest project, so `pnpm test` cannot see them — which is how
      # `gate-image-scan.mjs`, the script that decides whether a vulnerability
      # blocks a merge, went its whole life without a test. M49 PR2 wrote it,
      # and the first thing it found was four report shapes the gate passed
      # without a scan having happened. `node --test` needs no dependency and no
      # project wiring, so there was never an excuse, and there is none for the
      # next one either — every script here has a companion now, and the
      # PAIRING CHECK below is what keeps that true. The file-count floor is not
      # that check and never was: it counts test files, so two companions for
      # one script would satisfy it while a script went bare.
      # The glob is named explicitly because `node --test` does not walk a
      # DOT-directory: given `.github/scripts/` it hands the path to the module
      # loader and dies with MODULE_NOT_FOUND, which would have looked like a
      # broken test rather than a discovery quirk.
      #
      # TWO FLOORS, because this step is the SOLE invoker of every
      # `.github/scripts/*.test.mjs` and it cannot otherwise detect its own
      # disarming. MEASURED: with `nullglob` off (the default) an unmatched glob
      # reaches node as the LITERAL pattern; node 22 expands it itself, finds
      # nothing, prints `1..0 / # tests 0` and EXITS 0. Renaming the files from
      # `.test.mjs` to `.spec.mjs` — every test still on disk, every assertion
      # intact — takes this step from 34 passing tests to zero, silently and
      # green. Demonstrated with the real apostrophe defect planted in a
      # workflow: armed it exits 1, disarmed it exits 0 over the same defect.
      # The contrast that proves it is node's own: a missing path WITHOUT a `*`
      # makes node exit 1, so it is the metacharacter that suppresses the
      # failure. The floors sit deliberately BELOW the real numbers so ordinary
      # additions never trip them, and the numbers themselves are not restated
      # here: a count in prose beside a mechanism that measures one is a second
      # copy free to drift, and this comment had already drifted (it said 34
      # while the suite ran 38) within two commits of being written.
      - name: Test the CI helper scripts
        # PER FILE, not in aggregate. An aggregate floor cannot see one file go
        # blank: emptying assert-stack-counts.test.mjs left 31 of 41 tests, over
        # a floor of 30, and the step stayed green — the same defect the fence
        # this step runs was written to catch, one level up. Measured, not
        # feared. The file-count floor only catches a file being DELETED.
        #
        # awk takes the FIRST match and exits. Without that, a second `# pass`
        # line anywhere in the output makes the comparison an integer-expression
        # error, which is not a failure: the `if` takes its else branch and the
        # step exits 0 with the floor never evaluated. Also measured.
        run: |
          set -uo pipefail
          shopt -s nullglob

          # PAIRING, derived in both directions rather than asserted in a
          # comment: every helper script must have a test beside it. Counting
          # test files cannot answer this — it is satisfied by two companions
          # for one script — and the claim above this step is only true because
          # something checks it.
          scripts=()
          for m in .github/scripts/*.mjs; do
            case "$m" in *.test.mjs) continue ;; esac
            scripts+=("$m")
          done
          if [ "${#scripts[@]}" -lt 4 ]; then
            echo "::error::found ${#scripts[@]} helper scripts, expected at least 4 — the glob has stopped matching and this check is vacuous"
            exit 1
          fi
          bare=
          for m in "${scripts[@]}"; do
            [ -f "${m%.mjs}.test.mjs" ] || bare="${bare} $(basename "$m")"
          done
          if [ -n "$bare" ]; then
            echo "::error::helper scripts with no test companion:${bare}"
            exit 1
          fi

          files=(.github/scripts/*.test.mjs)
          if [ "${#files[@]}" -lt 5 ]; then
            echo "::error::found ${#files[@]} helper test files, expected at least 5 — a rename, a move or a pattern edit has disarmed this gate"
            exit 1
          fi
          total=0
          for f in "${files[@]}"; do
            # mktemp rather than the workspace: a CI step that drops a file in
            # the repo root is one somebody eventually commits.
            log=$(mktemp)
            if ! node --test "$f" > "$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            cat "$log"
            passed=$(awk '/^# pass /{print $3; exit}' "$log")
            if [ -z "$passed" ] || [ "$passed" -lt 5 ]; then
              echo "::error::$f reported ${passed:-no} passing tests, expected at least 5 — it ran but is not testing what it claims"
              exit 1
            fi
            total=$((total + passed))
          done
          if [ "$total" -lt 70 ]; then
            echo "::error::helper tests reported $total passing tests overall, expected at least 70"
            exit 1
          fi
          echo "helper tests: $total passing across ${#files[@]} files"

      # --coverage makes the per-package coverage tables visible in CI logs;
      # thresholds (95 backend / 90 frontend target) get enabled once real
      # CI-measured numbers exist — integration suites only run here, so local
      # coverage figures understate reality.
      - name: Test
        run: pnpm test -- --coverage
        env:
          PG_TEST_URL: postgres://estate:estate_ci@localhost:5432/estate_test

      # ─────────────────────────────────────────────────────────────────────
      # THE ONE CONFIGURATION NOTHING RAN, until the M16 PR5 review went
      # looking for why a coverage floor had drifted under without failing.
      #
      # `apps/services/identity/jest.config.js` sets its floor deliberately
      # near the number measured WITHOUT a database — the full-flow integration
      # suites are `describeIfPg` and skip without `PG_TEST_URL`, so that is the
      # number a developer sees, and the floor exists to be meaningful for them.
      # The step above sets `PG_TEST_URL`, so CI has only ever measured the
      # HIGH number. The floor was therefore evaluated by no gate at all, and
      # duly rotted: 62.24/66.60/28.43/60.24 against a 65/66/30/63 floor, under
      # on statements, lines AND functions, failing for anyone without Postgres.
      #
      # A threshold nothing evaluates is the fence-that-never-runs shape from
      # the other direction. This step is what makes it a gate.
      #
      # IT MUST PROVE IT RAN THE CONFIGURATION IT NAMES. A step that quietly
      # acquired a database would go green while measuring the wrong thing —
      # the same vacuity the stack workflow guards with exact counts — so the
      # `describeIfPg` suites are asserted to have SKIPPED. If that number is
      # ever 0, this step is testing the run the step above already covers.
      #
      # Scoped to identity because that is the package whose floor is
      # calibrated this way; another package adopting the convention adds its
      # own filter here rather than inheriting one by accident.
      - name: Test identity with NO database — the run its coverage floor is calibrated for
        working-directory: apps/services/identity
        env:
          PG_TEST_URL: ''
          # DECLARES this run to `test/ci-guard.spec.ts`, which otherwise
          # (correctly) fails any CI run with no PG_TEST_URL — the two gates
          # want opposite things from the same environment, and the first real
          # run of this step proved it by failing there. The flag is checked in
          # BOTH directions: a run that sets it and still has a database fails
          # the guard's other case, so it cannot be pasted into the step above
          # as a mute button.
          IDENTITY_NO_DB_RUN: '1'
        run: |
          set -euo pipefail
          if [ -n "${PG_TEST_URL:-}" ]; then
            echo "::error::PG_TEST_URL is set — this step exists to measure the run WITHOUT one"
            exit 1
          fi
          # `--coverage` is what arms the thresholds; without it jest exits 0
          # having checked nothing. Run through the package's own jest rather
          # than `pnpm --filter … test --`, which does NOT forward these flags
          # (measured: no coverage collected, no output file written, exit 0).
          # Written to the runner temp dir so the repo tree stays clean —
          # this artifact is read once, two lines below, and never committed.
          out="${RUNNER_TEMP:-.}/identity-nopg.json"
          npx jest --coverage --json --outputFile="$out"
          node -e '
            const r = require(process.argv[1]);
            const { numPassedTests: passed, numPendingTests: pending, numFailedTests: failed } = r;
            console.log(`passed=${passed} pending=${pending} failed=${failed}`);
            if (failed > 0) { console.error("::error::failures without a database"); process.exit(1); }
            if (pending === 0) {
              console.error("::error::no suite skipped, so a database was reachable — this step measured the wrong configuration");
              process.exit(1);
            }
            if (passed < 100) {
              console.error(`::error::only ${passed} tests ran; this step is not exercising the suite`);
              process.exit(1);
            }
          ' "$out"
