# The browser extension's release artifact: built twice, compared, attested.
#
# ITS OWN WORKFLOW RATHER THAN A JOB IN `images.yml`, for one reason that
# outweighs the duplication: this is the only place in the repo that asks for
# `id-token: write`, and an escalation like that belongs in a file whose subject
# is the thing being signed. `images.yml` is about container images, and every
# step after its Build is docker-shaped.
#
# WHAT THE TWO BUILDS PROVE, AND WHAT THEY DO NOT. Building twice on ONE runner
# shows the pipeline is deterministic given one toolchain: no timestamps, no
# walk order, no umask, no state carried between runs. It does NOT show
# cross-machine reproducibility — which is exactly what a third party's own
# rebuild tests, and why `apps/vault-extension/VERIFYING.md` asks them to do it
# rather than to trust this job. Two builds here plus one build there is the
# whole claim; neither half is sufficient alone.
#
# NODE IS NOT PINNED TO A PATCH, deliberately. `setup-node` with `22` resolves
# to the newest 22.x, which drifts — and that is the one input a reproducibility
# claim would most like to freeze, since zlib's deflate output is not guaranteed
# stable across patch releases (measured as unverified, not as safe). Freezing
# it would mean shipping a security artifact on an unpatched runtime for as long
# as the pin stood, which is a worse trade. So the digest is LABELLED with the
# Node that produced it, in the summary and in the `.sha256` file, and a Node
# bump that moves the digest is a reviewed republish rather than an alarm.
name: Extension

on:
  push:
    branches: [main]
    paths:
      - 'apps/vault-extension/**'
      - 'packages/vault-crypto/**'
      - '.github/workflows/extension.yml'
  pull_request:
    paths:
      - 'apps/vault-extension/**'
      - 'packages/vault-crypto/**'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The two the attestation needs, scoped to this job rather than the
      # workflow, so nothing else added here inherits the ability to mint one.
      id-token: write
      attestations: write
    env:
      # The origin is baked into the manifest AND `origin.js` at build time, so
      # a package is only meaningful for one deployment. No production origin
      # exists yet (the M5 cloud deferral), so this falls back to the dev value
      # — and the artifact is LABELLED with whatever it used, because a
      # localhost-origin package that looks shippable is the failure to avoid.
      VAULT_ORIGIN: ${{ vars.VAULT_ORIGIN || 'http://vault.localhost:3010' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # `--force` on BOTH builds, so neither is served from turbo's cache. A
      # cache hit restores outputs without running the compile, which would make
      # this compare one build against a copy of itself.
      - name: Build the extension
        run: pnpm build --filter=@estate/vault-extension --force

      - name: Pack (first)
        run: node apps/vault-extension/scripts/pack-extension.mjs
        env:
          PACK_OUT: ${{ runner.temp }}/first.zip

      # A CLEAN REBUILD, not a repack. Repacking the same `dist` would only
      # re-prove the packer is a pure function of its input, which `pack.spec.ts`
      # already covers per factor. The claim under test here is that the BUILD is
      # deterministic, so the tree is deleted and produced again.
      - name: Rebuild from scratch
        run: |
          rm -rf apps/vault-extension/dist
          pnpm build --filter=@estate/vault-extension --force

      - name: Pack (second)
        run: node apps/vault-extension/scripts/pack-extension.mjs
        env:
          PACK_OUT: ${{ runner.temp }}/second.zip

      - name: The two builds must be byte-identical
        id: digest
        run: |
          first=$(sha256sum "${RUNNER_TEMP}/first.zip" | cut -d' ' -f1)
          second=$(sha256sum "${RUNNER_TEMP}/second.zip" | cut -d' ' -f1)
          {
            echo "### Extension package"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| build 1 | \`${first}\` |"
            echo "| build 2 | \`${second}\` |"
            echo "| origin | \`${VAULT_ORIGIN}\` |"
            echo "| node | \`$(node --version)\` |"
            echo "| size | $(stat -c%s "${RUNNER_TEMP}/first.zip") bytes |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$first" != "$second" ]; then
            echo "::error::two builds of ${GITHUB_SHA} produced different archives — ${first} then ${second}"
            exit 1
          fi
          echo "sha256=${first}" >> "$GITHUB_OUTPUT"
          cp "${RUNNER_TEMP}/first.zip" "${RUNNER_TEMP}/vault-extension.zip"

      # The digest and every input that decides it travel WITH the archive, so a
      # third party comparing their own rebuild does not have to reconstruct the
      # conditions from a workflow file that has moved on since.
      - name: Record the digest and its inputs beside the archive
        run: |
          {
            echo "${{ steps.digest.outputs.sha256 }}  vault-extension.zip"
            echo "# commit  ${GITHUB_SHA}"
            echo "# node    $(node --version)"
            echo "# origin  ${VAULT_ORIGIN}"
          } > "${RUNNER_TEMP}/vault-extension.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: vault-extension
          path: |
            ${{ runner.temp }}/vault-extension.zip
            ${{ runner.temp }}/vault-extension.zip.sha256
          if-no-files-found: error

      # SLSA build provenance, retrievable unauthenticated for a public repo, so
      # a third party runs `gh attestation verify` with no relationship to this
      # project. NOT on pull_request: a signed statement that some unmerged
      # branch built this artifact is a statement nobody should act on, and
      # `pull_request` runs cannot hold `id-token: write` from a fork anyway.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/vault-extension.zip
