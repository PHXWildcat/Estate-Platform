# The browser extension's release artifact: built twice, compared, attested.
#
# ITS OWN WORKFLOW RATHER THAN A JOB IN `images.yml`, for one reason that
# outweighs the duplication: this is the only place in the repo that asks for
# `id-token: write`, and an escalation like that belongs in a file whose subject
# is the thing being signed. `images.yml` is about container images, and every
# step after its Build is docker-shaped.
#
# THE SIGNING CAPABILITY IS IN A SEPARATE JOB FROM THE CODE. `package` builds
# the branch's own source — arbitrary code, by construction, since a build
# script is code — and holds `contents: read` and nothing else. `attest` holds
# `id-token: write` + `attestations: write`, runs no repository code, and only
# downloads the artifact and re-derives its digest before signing. Job-level
# permissions are static, so a single job would hold the signing capability on
# every event including `pull_request` runs that never use it; splitting is the
# only way to actually scope it. `attest` re-computes the digest rather than
# trusting the one `package` reported, because otherwise it would be signing
# whatever landed in the artifact store.
#
# WHAT THE CHECKS PROVE, AND WHAT THEY DO NOT. Two builds in one job vary the
# clock and any state carried between them — and NOT the walk order, the umask,
# the uid or the hostname, which are properties of the runner and identical in
# both. That gap is not theoretical: a review injected a uid/gid field into the
# archive and the double build passed, twice the same wrong answer. So a third
# pack runs under a DIFFERENT identity in a container. What none of it shows is
# cross-machine reproducibility, which is what a third party's own rebuild
# tests, and why `apps/vault-extension/VERIFYING.md` asks them to do it rather
# than to trust this job.
#
# NODE IS NOT PINNED TO A PATCH, AND NO LONGER NEEDS TO BE. `setup-node` with
# `22` resolves to the newest 22.x, and it does drift — measured, between two
# runs of this workflow hours apart (v22.23.2 then v22.23.1). That mattered
# while the archive was deflate-compressed, because zlib's output depends on how
# Node was BUILT rather than on its version, so the published digest would have
# moved between two runs of the SAME commit while both double-build checks went
# green. The packer now STORES every entry, so the digest is a function of the
# compiled bytes and a handful of constants: no zlib, no Node, no platform.
# Measured across that very drift — the runner and a laptop on different Node
# patches, distributions, operating systems and architectures agree exactly. The
# version is still recorded with each digest, as provenance rather than as
# something a verifier has to match.
name: Extension

# THE TRIGGER IS DERIVED FROM THE BUILD GRAPH, NOT REMEMBERED.
#
# This list decides whether the artifact's reproducibility is ever checked and
# whether an attestation is minted, so a path missing from it is a commit that
# changes the signed bytes with none of the above happening — the last
# attestation on `main` silently stops describing `main`.
#
# It was hand-written and it had drifted, in three places at once. `turbo.json`
# declares the build task's `env`, and Turbo 2 runs tasks in STRICT env mode:
# measured, deleting `VAULT_ORIGIN` from that list makes the variable invisible
# to the build, `build-package.mjs` falls through to its localhost default, the
# build exits 0 and the packed digest moves — the M8 PR5 / M16 PR4b defect, in
# the same `turbo.json` whose own comment describes it. `pnpm-lock.yaml` pins
# the compiler, and a TypeScript bump moves the compiled bytes. And
# `packages/config/**` holds `tsconfig.base.json`, which `tsconfig.build.json`
# extends transitively — an input nobody had noticed at all.
#
# So the list is no longer maintained by memory. `test/workflow-inputs.spec.ts`
# asks turbo for the task graph, adds the inputs turbo does not model as
# DECLARED entries with a reason each, and asserts this list covers the union in
# both directions — the same remedy this repo applied to stack.yml's migrate
# list, `web.Dockerfile`'s `public/` and images.yml's diagnostics containers:
# derive from the project rather than delete the list. A new dependency arrives
# covered here or `ci.yml` goes red.
#
# BOTH EVENT LISTS ARE THE SAME LIST, and the fence requires that: a `push`
# filter narrower than the `pull_request` one means `main` checks less than the
# PR that produced it, which is the direction nobody would notice. They are
# written out TWICE rather than shared by a YAML anchor, deliberately — GitHub
# does not document anchor support in workflow files, this would be the repo's
# first, and the failure mode if its parser resolves one to nothing is a paths
# filter that matches nothing and a workflow that silently never runs, which is
# the very defect being fixed here. Duplication a fence checks beats cleverness
# a fence cannot.
on:
  push:
    branches: [main]
    paths:
      - 'apps/vault-extension/**'
      - 'packages/vault-crypto/**'
      - 'packages/config/**'
      - 'turbo.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.gitattributes'
      - '.github/workflows/extension.yml'
  pull_request:
    paths:
      - 'apps/vault-extension/**'
      - 'packages/vault-crypto/**'
      - 'packages/config/**'
      - 'turbo.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.gitattributes'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      origin: ${{ steps.digest.outputs.origin }}
    env:
      # The origin is baked into the manifest AND `origin.js` at build time, so
      # a package is only meaningful for one deployment. No production origin
      # exists yet (the M5 cloud deferral), so this falls back to the dev value
      # — and the artifact is LABELLED with whatever it used, because a
      # localhost-origin package that looks shippable is the failure to avoid.
      VAULT_ORIGIN: ${{ vars.VAULT_ORIGIN || 'http://vault.localhost:3010' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # THE VARIABLE MUST BE PROVED TO ARRIVE, AND ONLY A VALUE THAT COULD NOT
      # HAVE ARRIVED BY ACCIDENT PROVES IT. `VAULT_ORIGIN` above falls back to
      # the packager's own `DEFAULT_ORIGIN`, so a build that received it and a
      # build where Turbo's strict env mode stripped it are today BYTE-IDENTICAL
      # — the state PR #116 found the web image in, whose lesson was that a
      # value that arrived and a value that fell through are indistinguishable
      # until you make them differ. So one throwaway build runs with an origin
      # the default can never equal, and the check reads it back OUT OF THE
      # PACKED ARCHIVE rather than out of the environment that set it.
      #
      # A FENCE PER LAYER IS NOT A FENCE ON THE CHAIN, which is why the two that
      # exist are not enough: `test/turbo-env.spec.ts` proves the DECLARATION
      # and never runs a build, and `test/manifest.spec.ts` spawns
      # `build-package.mjs` directly, so turbo is not in its path either.
      # Neither can see turbo strip a variable. This step is the only place the
      # whole chain — job env, turbo, tsc, packer, archive — is exercised end to
      # end on the artifact that gets signed.
      #
      # `.invalid` is reserved by RFC 2606 and can never resolve, matching the
      # probe origins images.yml uses for the same purpose.
      - name: The build must receive VAULT_ORIGIN rather than fall through
        env:
          VAULT_ORIGIN: https://vault.probe.invalid
          PACK_OUT: ${{ runner.temp }}/probe.zip
        run: |
          set -euo pipefail
          pnpm build --filter=@estate/vault-extension --force
          node apps/vault-extension/scripts/pack-extension.mjs > /dev/null
          baked=$(unzip -p "${PACK_OUT}" manifest.json \
            | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).host_permissions.join(",")')
          if [ "$baked" != "${VAULT_ORIGIN}/*" ]; then
            echo "::error::VAULT_ORIGIN never reached the build — the package permits ${baked}, not ${VAULT_ORIGIN}/*" && exit 1
          fi
          # Both places, because the offscreen document cannot read the manifest
          # back and reads `origin.js` instead — a package where only one of them
          # took the value is a package that loads and cannot reach its vault.
          if ! unzip -p "${PACK_OUT}" origin.js | grep -qF "'${VAULT_ORIGIN}'"; then
            echo "::error::origin.js does not carry ${VAULT_ORIGIN}" && exit 1
          fi
          rm -rf apps/vault-extension/dist

      # `--force` on BOTH builds, so neither is served from turbo's cache. A
      # cache hit restores outputs without running the compile, which would make
      # this compare one build against a copy of itself.
      - name: Build the extension
        run: pnpm build --filter=@estate/vault-extension --force

      - name: Pack (first)
        run: node apps/vault-extension/scripts/pack-extension.mjs
        env:
          PACK_OUT: ${{ runner.temp }}/first.zip

      # A CLEAN REBUILD, not a repack. Repacking the same `dist` would only
      # re-prove the packer is a pure function of its input, which `pack.spec.ts`
      # already covers per factor. The claim under test here is that the BUILD is
      # deterministic, so the tree is deleted and produced again.
      - name: Rebuild from scratch
        run: |
          rm -rf apps/vault-extension/dist
          pnpm build --filter=@estate/vault-extension --force

      - name: Pack (second)
        run: node apps/vault-extension/scripts/pack-extension.mjs
        env:
          PACK_OUT: ${{ runner.temp }}/second.zip

      # THE CHECK THE DOUBLE BUILD CANNOT DO. Both builds above run as the same
      # user on the same host, so any byte the packer derived from the BUILDER
      # rather than from the files would be identical in both and agree. A
      # review proved that exactly: a uid/gid field was added to the archive and
      # this job stayed green. Packing once more under a different uid, gid and
      # hostname is what closes it. The digest comes off stdout because the
      # container cannot write into the runner's workspace as a foreign user.
      - name: Pack under a DIFFERENT identity
        id: identity
        run: |
          set -euo pipefail
          third=$(docker run --rm --user 4321:4321 --hostname elsewhere \
            -v "$PWD:/w" -w /w -e PACK_OUT=/tmp/third.zip node:22 \
            node apps/vault-extension/scripts/pack-extension.mjs | head -1 | cut -d' ' -f1)
          if [ ${#third} -ne 64 ]; then
            echo "::error::the foreign-identity pack produced no digest" && exit 1
          fi
          echo "sha256=${third}" >> "$GITHUB_OUTPUT"

      - name: The builds must agree, with each other and across identities
        id: digest
        run: |
          set -euo pipefail
          first=$(sha256sum "${RUNNER_TEMP}/first.zip" | cut -d' ' -f1)
          second=$(sha256sum "${RUNNER_TEMP}/second.zip" | cut -d' ' -f1)
          third='${{ steps.identity.outputs.sha256 }}'
          # Anti-vacuity: without this, two unreadable archives yield two empty
          # strings, which compare equal and report success.
          for d in "$first" "$second" "$third"; do
            if [ ${#d} -ne 64 ]; then echo "::error::missing digest: '${d}'" && exit 1; fi
          done
          # THE ORIGIN IS READ OUT OF THE ARCHIVE, NEVER OFF THE ENVIRONMENT.
          # VERIFYING.md tells a third party to rebuild with the origin from the
          # digest file, and to reject a package whose baked origin is not their
          # deployment's — so that line has to be a statement ABOUT THE BYTES.
          # Echoing `$VAULT_ORIGIN` made it a statement about this job's intent,
          # which is the one thing a provenance record must not be: the two
          # differ in exactly the case the record exists to catch.
          baked=$(unzip -p "${RUNNER_TEMP}/first.zip" manifest.json \
            | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).host_permissions.join(",")')
          baked="${baked%/\*}"
          if [ "$baked" != "$VAULT_ORIGIN" ]; then
            echo "::error::the package permits ${baked} but was built for ${VAULT_ORIGIN}" && exit 1
          fi
          {
            echo "### Extension package"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| build 1 | \`${first}\` |"
            echo "| build 2 | \`${second}\` |"
            echo "| foreign identity | \`${third}\` |"
            echo "| origin (read from the archive) | \`${baked}\` |"
            echo "| node | \`$(node --version)\` |"
            echo "| size | $(stat -c%s "${RUNNER_TEMP}/first.zip") bytes |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$first" != "$second" ]; then
            echo "::error::two builds of ${GITHUB_SHA} differ — ${first} then ${second}" && exit 1
          fi
          if [ "$first" != "$third" ]; then
            echo "::error::the archive depends on who built it — ${first} as the runner, ${third} as uid 4321" && exit 1
          fi
          echo "sha256=${first}" >> "$GITHUB_OUTPUT"
          echo "origin=${baked}" >> "$GITHUB_OUTPUT"
          cp "${RUNNER_TEMP}/first.zip" "${RUNNER_TEMP}/vault-extension.zip"

      # The digest and every input that decides it travel WITH the archive, so a
      # third party comparing their own rebuild does not have to reconstruct the
      # conditions from a workflow file that has moved on since.
      - name: Record the digest and its inputs beside the archive
        run: |
          set -euo pipefail
          {
            echo "${{ steps.digest.outputs.sha256 }}  vault-extension.zip"
            echo "# commit  ${GITHUB_SHA}"
            echo "# node    $(node --version)"
            echo "# origin  ${{ steps.digest.outputs.origin }}"
          } > "${RUNNER_TEMP}/vault-extension.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: vault-extension
          path: |
            ${{ runner.temp }}/vault-extension.zip
            ${{ runner.temp }}/vault-extension.zip.sha256
          if-no-files-found: error

  # SLSA build provenance, retrievable unauthenticated for a public repo, so a
  # third party runs `gh attestation verify` with no relationship to this
  # project. A separate job so the signing capability is never held while
  # repository code is running, and gated on `main` rather than merely on "not a
  # pull request" — `workflow_dispatch` accepts any ref, and an attestation
  # minted from a side branch is indistinguishable from a `main` one unless the
  # verifier passes `--source-ref`, which VERIFYING.md now tells them to do and
  # which this makes true in the first place.
  attest:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vault-extension
          path: ${{ runner.temp }}/art

      # Re-derived, not trusted: this job signs the bytes it can see, and the
      # only thing tying them to the build is this comparison.
      #
      # AND THAT IS WHY THE ORIGIN IS NOT RE-CHECKED HERE, which is otherwise
      # the obvious place for it. `package` refuses to continue unless the
      # origin read out of the archive is the one it was built for; this step
      # then proves these bytes ARE that archive. A digest match is not evidence
      # about most properties, but it is total: identical bytes cannot hold a
      # different manifest. A second origin check here would be a second copy of
      # a decision, free to drift from the one that gates the build.
      - name: The artifact must be the one that was built
        run: |
          set -euo pipefail
          here=$(sha256sum "${RUNNER_TEMP}/art/vault-extension.zip" | cut -d' ' -f1)
          if [ "$here" != '${{ needs.package.outputs.sha256 }}' ]; then
            echo "::error::artifact digest ${here} is not the built ${{ needs.package.outputs.sha256 }}" && exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/art/vault-extension.zip

  # ─────────────────────────────────────────────────────────────────────────
  # THE ARTIFACT, OPENING A VAULT IN A REAL BROWSER.
  #
  # M16 PR2b listed as owed: the offscreen document's lifecycle,
  # `chrome.offscreen.createDocument` from a service worker, and the worker
  # boundary. Everything the extension claimed rested on a hand-written
  # `chrome` double in jsdom — which PR3b then showed was MORE GENEROUS THAN
  # THE PLATFORM, because the double supplied `getManifest` unconditionally and
  # an offscreen document does not have it. The extension consequently could
  # never have unlocked a vault, and 477 green tests said nothing about it.
  #
  # THIS JOB EXISTS BECAUSE A DOCUMENTED CONCLUSION WAS WRONG. PR3b measured
  # that Chrome refuses `--load-extension` — true — and concluded that loading
  # "cannot be scripted" and "no CI job can ever stand in for it". The CDP
  # command `Extensions.loadUnpacked` works. The flag is gone; the capability
  # is not.
  #
  # IT IS A SEPARATE JOB FROM `package`, and not because of permissions this
  # time: it needs a browser, a server and a profile directory, none of which
  # the reproducibility job should have to carry. It holds `contents: read` and
  # nothing else — it signs nothing.
  #
  # CHROME IS DELIBERATELY NOT PINNED HERE, which inverts this workflow's rule
  # for the packaging jobs. Those must pin, because a moving toolchain moves the
  # digest. This one is watching for the PLATFORM to change under the extension
  # — a headless mode that stops loading extensions, an offscreen `reason` that
  # stops being accepted, a CDP command that moves. Pinning would hide exactly
  # what it is here to notice. The version is printed with the results.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # A distinctive port: the origin is baked into the manifest at build time,
      # so the artifact under test is built FOR the stand-in. That is the same
      # pipeline with a different origin, and the job says so rather than
      # implying the released package was driven.
      VAULT_PORT: '3111'
      VAULT_ORIGIN: 'http://vault.localhost:3111'
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build and pack for the stand-in origin
        run: |
          set -euo pipefail
          pnpm build --filter=@estate/vault-extension --force
          node apps/vault-extension/scripts/pack-extension.mjs

      # THE PACKED BYTES ARE WHAT RUNS, not the source tree. A packaging slip
      # that drops a file from the archive — the class that shipped once, when
      # `web.Dockerfile` lost the vendored fonts — is only visible if the thing
      # under test is the archive.
      - name: Extract the package
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/ext"
          unzip -q apps/vault-extension/vault-extension.zip -d "${RUNNER_TEMP}/ext"
          test -f "${RUNNER_TEMP}/ext/manifest.json"
          test -f "${RUNNER_TEMP}/ext/lib/vault-crypto/index.js"

      - name: Drive it in Chrome
        run: |
          set -euo pipefail
          google-chrome --version
          # The stand-in speaks the real SRP protocol and emits one JSON line of
          # state — including the Secret Key the harness must type and which
          # must never come back on the wire.
          node apps/vault-extension/scripts/stand-in-vault.mjs > "${RUNNER_TEMP}/vault.json" &
          for i in $(seq 1 40); do
            [ -s "${RUNNER_TEMP}/vault.json" ] && break
            sleep 0.5
          done
          if [ ! -s "${RUNNER_TEMP}/vault.json" ]; then
            echo "::error::the stand-in vault never reported ready" && exit 1
          fi
          VAULT_STATE="$(head -1 "${RUNNER_TEMP}/vault.json")" \
          EXT_DIR="${RUNNER_TEMP}/ext" \
          CHROME_BIN="$(command -v google-chrome)" \
            node apps/vault-extension/scripts/browser-smoke.mjs
