events {}

http {
  access_log off;

  # Large enough for the documents service's 16 MiB body limit: an S3 PUT of a
  # 10 MiB decoded upload passes through here.
  client_max_body_size 32m;

  server {
    listen 443 ssl;
    server_name aws-tls;

    ssl_certificate     /certs/aws-tls.crt;
    ssl_certificate_key /certs/aws-tls.key;
    # TLS 1.2+ only — docs/01 §4 wants 1.3 externally; this is the local
    # analogue and keeps the negotiation realistic rather than permissive.
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://localstack:4566;
      proxy_http_version 1.1;
      # SigV4 signs the Host header, and the AWS SDK signed it for the name it
      # dialled — pass that through unchanged or every request fails its
      # signature check.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_request_buffering off;
    }
  }
}
